{% extends "admin/base_site.html" %}

{% block extrastyle %}
{{ block.super }}
<style>
    .admin-custom {
        display: flex;
        flex-direction: column;
        gap: 20px;
        padding: 24px 0 32px;
    }

    .admin-page-header {
        align-items: flex-start;
        display: flex;
        gap: 16px;
        justify-content: space-between;
    }

    .admin-page-title {
        color: var(--color-font-important-light);
        font-size: 24px;
        font-weight: 700;
        line-height: 1.25;
        margin: 0;
    }

    .admin-page-subtitle {
        color: var(--color-font-subtle-light);
        font-size: 13px;
        line-height: 1.5;
        margin: 6px 0 0;
    }

    .admin-actions {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
    }

    .admin-card {
        background: #fff;
        border: 1px solid var(--color-base-200);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, .04);
        overflow: hidden;
    }

    .admin-card-body {
        padding: 18px;
    }

    .admin-toolbar {
        align-items: center;
        display: grid;
        gap: 10px;
        grid-template-columns: minmax(220px, 1fr) auto auto;
        margin-bottom: 16px;
    }

    .admin-toolbar input[type="search"],
    .admin-toolbar input[type="text"],
    .admin-toolbar select,
    .admin-form input[type="text"],
    .admin-form input[type="number"],
    .admin-form input[type="url"],
    .admin-form input[type="email"],
    .admin-form input[type="password"],
    .admin-form select,
    .admin-form textarea {
        background: #fff;
        border: 1px solid var(--color-base-200);
        border-radius: 8px;
        box-sizing: border-box;
        color: var(--color-font-important-light);
        min-height: 38px;
        padding: 8px 12px;
        width: 100%;
    }

    .admin-toolbar input:focus,
    .admin-toolbar select:focus,
    .admin-form input:focus,
    .admin-form select:focus,
    .admin-form textarea:focus {
        border-color: var(--color-primary-500);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-primary-500) 14%, transparent);
        outline: none;
    }

    .admin-btn,
    .admin-btn:link,
    .admin-btn:visited,
    .button.admin-btn {
        align-items: center;
        background: var(--color-primary-600);
        border: 1px solid var(--color-primary-600);
        border-radius: 8px;
        color: #fff;
        display: inline-flex;
        font-size: 13px;
        font-weight: 600;
        gap: 6px;
        line-height: 1;
        min-height: 38px;
        padding: 0 13px;
        text-decoration: none;
        white-space: nowrap;
    }

    .admin-btn:hover {
        background: var(--color-primary-700);
        color: #fff;
    }

    .admin-btn-secondary,
    .admin-btn-secondary:link,
    .admin-btn-secondary:visited {
        background: #fff;
        border-color: var(--color-base-200);
        color: var(--color-font-important-light);
    }

    .admin-btn-secondary:hover {
        background: var(--color-base-50);
        color: var(--color-primary-600);
    }

    .admin-table-wrap {
        overflow-x: auto;
    }

    .admin-table {
        border-collapse: separate;
        border-spacing: 0;
        min-width: 760px;
        width: 100%;
    }

    .admin-table th {
        background: var(--color-base-50);
        border-bottom: 1px solid var(--color-base-200);
        color: var(--color-primary-700);
        font-size: 11px;
        font-weight: 700;
        padding: 13px 14px;
        text-align: left;
        text-transform: uppercase;
        white-space: nowrap;
    }

    .admin-table td {
        border-bottom: 1px solid var(--color-base-200);
        color: var(--color-font-default-light);
        padding: 13px 14px;
        vertical-align: middle;
    }

    .admin-table tbody tr:hover td {
        background: var(--color-base-50);
    }

    .admin-table tbody tr:last-child td {
        border-bottom: 0;
    }

    .admin-table strong {
        color: var(--color-font-important-light);
        font-weight: 650;
    }

    .admin-muted {
        color: var(--color-font-subtle-light);
        font-size: 12px;
    }

    .admin-link {
        color: var(--color-primary-600);
        font-weight: 600;
        text-decoration: none;
    }

    .admin-link:hover {
        color: var(--color-primary-700);
        text-decoration: underline;
    }

    .admin-badge {
        align-items: center;
        background: var(--color-base-100);
        border-radius: 999px;
        color: var(--color-font-important-light);
        display: inline-flex;
        font-size: 12px;
        font-weight: 600;
        gap: 5px;
        min-height: 22px;
        padding: 2px 9px;
        white-space: nowrap;
    }

    .admin-badge-success {
        background: #dcfce7;
        color: #166534;
    }

    .admin-badge-warning {
        background: #fef3c7;
        color: #92400e;
    }

    .admin-badge-danger {
        background: #fee2e2;
        color: #991b1b;
    }

    .admin-badge-info {
        background: #dbeafe;
        color: #1d4ed8;
    }

    .admin-empty {
        color: var(--color-font-subtle-light);
        padding: 32px 18px;
        text-align: center;
    }

    .admin-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .admin-stat {
        border: 1px solid var(--color-base-200);
        border-radius: 12px;
        padding: 16px;
    }

    .admin-stat-label {
        color: var(--color-font-subtle-light);
        font-size: 13px;
    }

    .admin-stat-value {
        color: var(--color-font-important-light);
        font-size: 28px;
        font-weight: 750;
        line-height: 1.2;
        margin-top: 8px;
    }

    .admin-form {
        max-width: 920px;
    }

    .admin-form .form-row {
        border-bottom: 1px solid var(--color-base-200);
        padding: 14px 0;
    }

    .admin-form label {
        color: var(--color-font-important-light);
        display: block;
        font-weight: 650;
        margin-bottom: 7px;
    }

    .admin-form .help {
        color: var(--color-font-subtle-light);
        font-size: 12px;
        margin-top: 6px;
    }

    .admin-detail-list {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .admin-detail-item {
        border-bottom: 1px solid var(--color-base-100);
        padding: 4px 0 10px;
    }

    .admin-detail-label {
        color: var(--color-font-subtle-light);
        font-size: 12px;
        margin-bottom: 3px;
    }

    .admin-detail-value {
        color: var(--color-font-important-light);
        font-weight: 600;
        overflow-wrap: anywhere;
    }

    .admin-image-thumb {
        background: var(--color-base-100);
        border: 1px solid var(--color-base-200);
        border-radius: 8px;
        height: 48px;
        object-fit: cover;
        width: 48px;
    }

    .admin-image-preview {
        align-items: center;
        background: var(--color-base-50);
        border: 1px dashed var(--color-base-300);
        border-radius: 10px;
        display: flex;
        gap: 12px;
        margin-top: 10px;
        min-height: 76px;
        padding: 10px;
    }

    .admin-image-preview img {
        background: #fff;
        border: 1px solid var(--color-base-200);
        border-radius: 8px;
        height: 64px;
        object-fit: cover;
        width: 64px;
    }

    .admin-image-preview span {
        color: var(--color-font-subtle-light);
        font-size: 12px;
        line-height: 1.4;
    }

    .admin-image-large {
        background: var(--color-base-100);
        border: 1px solid var(--color-base-200);
        border-radius: 10px;
        max-height: 180px;
        max-width: 240px;
        object-fit: cover;
        width: 100%;
    }

    .admin-image-grid {
        display: grid;
        gap: 12px;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    }

    .admin-image-grid img {
        aspect-ratio: 1;
        border: 1px solid var(--color-base-200);
        border-radius: 10px;
        object-fit: cover;
        width: 100%;
    }

    .admin-chart-grid {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .admin-chart-card {
        min-height: 320px;
    }

    .admin-chart-header {
        align-items: flex-start;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
    }

    .admin-chart-frame {
        height: 250px;
        position: relative;
    }

    .admin-chart-frame canvas {
        max-height: 250px;
    }

    @media (max-width: 820px) {
        .admin-page-header {
            flex-direction: column;
        }

        .admin-actions {
            justify-content: flex-start;
            width: 100%;
        }

        .admin-toolbar {
            grid-template-columns: 1fr;
        }

        .admin-chart-grid {
            grid-template-columns: 1fr;
        }
    }

    .dark .admin-card,
    .dark .admin-btn-secondary,
    .dark .admin-toolbar input[type="search"],
    .dark .admin-toolbar input[type="text"],
    .dark .admin-toolbar select,
    .dark .admin-form input,
    .dark .admin-form select,
    .dark .admin-form textarea {
        background: var(--color-base-900);
    }
</style>
{% endblock %}

{% block content %}
<div class="admin-custom">
    {% block admin_custom_content %}{% endblock %}
</div>
{% endblock %}
